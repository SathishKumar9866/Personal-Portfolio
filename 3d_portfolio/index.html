<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- set theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", t === "dark" ? "#0F2228" : "#FFFFFF");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <title>Sathish Kumar — ML / AI Engineer</title>
    <meta
      name="description"
      content="I take a real problem from the data and the model to a working interface — RAG, computer vision, and shipped products across the data-to-AI stack."
    />
    <!-- TODO: set canonical to the real production domain once deployed (e.g. Vercel URL) -->
    <!-- <link rel="canonical" href="https://YOUR-REAL-DOMAIN/" /> -->

    <!-- monogram favicon (red, white S) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sathish Kumar — ML / AI Engineer" />
    <meta
      property="og:description"
      content="Data to AI, end to end. RAG, computer vision, and shipped products."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sathish Kumar",
        "jobTitle": "ML / AI Engineer",
        "url": "https://github.com/SathishKumarAI",
        "sameAs": [
          "https://github.com/SathishKumarAI",
          "https://www.linkedin.com/in/SathishKumarAI"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
