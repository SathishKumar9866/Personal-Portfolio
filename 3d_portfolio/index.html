<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- set theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <title>Sathish Kumar — ML / AI Engineer</title>
    <meta
      name="description"
      content="I take a real problem from the data and the model to a working interface — RAG, computer vision, and shipped products across the data-to-AI stack."
    />
    <!-- TODO: set canonical to the real production domain once deployed (e.g. Vercel URL) -->
    <!-- <link rel="canonical" href="https://YOUR-REAL-DOMAIN/" /> -->

    <!-- monogram favicon, amber on ink -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF3621'/%3E%3Ctext x='50%25' y='54%25' font-family='Barlow,Arial,sans-serif' font-size='42' font-weight='700' fill='%23ffffff' text-anchor='middle' dominant-baseline='middle'%3ES%3C/text%3E%3C/svg%3E"
    />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sathish Kumar — ML / AI Engineer" />
    <meta
      property="og:description"
      content="Data to AI, end to end. RAG, computer vision, and shipped products."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sathish Kumar",
        "jobTitle": "ML / AI Engineer",
        "url": "https://github.com/SathishKumarAI",
        "sameAs": [
          "https://github.com/SathishKumarAI",
          "https://www.linkedin.com/in/SathishKumarAI"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
